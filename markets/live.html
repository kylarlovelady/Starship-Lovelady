<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live View</title>
<style>
:root{color-scheme:dark;--bg:#080d1a;--card:#101830;--line:#1f2a4a;--tx:#e8edf8;--mut:#8a97b8;--red:#ff4d57;--grn:#0fd68f;--amb:#e0a93b;--org:#f7931a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
a.back{color:var(--mut);text-decoration:none;font-size:14px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.live{color:var(--grn);border-color:#1b5a47}.chip.stale{color:var(--amb);border-color:#6b5320}.chip.sample{color:#7aa7ff;border-color:#2c4a8a}
.strats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.sb{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px}
.sb.on{color:var(--tx);border-color:#3b5bd6;background:#16224a}
.hdr{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.btc{width:34px;height:34px;border-radius:9px;background:var(--org);color:#fff;font-weight:800;display:grid;place-items:center;font-size:19px}
.hdr h1{font-size:22px;margin:0;letter-spacing:-.3px}
.cd{margin-left:auto;background:#1b2340;border-radius:99px;padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.px{display:flex;gap:16px;margin-bottom:6px}.px>div{flex:1}.px small{display:block;color:var(--mut);font-size:13px}
.px b{font-size:23px;font-variant-numeric:tabular-nums}.dn{color:var(--red)}.up{color:var(--grn)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 4px 2px;margin-bottom:10px}
.chart svg{display:block;width:100%;height:auto}
.btns{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 4px}
.bt{border:0;border-radius:999px;padding:15px 8px;font:inherit;font-weight:800;font-size:18px;color:#04140d;position:relative;overflow:hidden}
.bt.u{background:var(--grn)}.bt.d{background:var(--red);color:#2a0508}
.bt small{display:block;text-align:center;color:var(--mut);font-size:13px;margin-top:5px;font-weight:500}
.cell{text-align:center}
.sellrow{display:flex;justify-content:center;margin:2px 0 8px}
.sell{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:99px;padding:6px 22px;font:inherit;font-size:14px;position:relative;overflow:hidden}
.tap{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;pointer-events:none;animation:tap 1.1s ease-out forwards;z-index:4}
.tap:after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #fff;animation:rip 1.1s ease-out forwards}
@keyframes tap{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}60%{transform:scale(.85);opacity:1}100%{transform:scale(.9);opacity:0}}
@keyframes rip{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:-34px;background:#fff;color:#0a1020;border-radius:10px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap;animation:fade 2.4s ease forwards;z-index:5}
@keyframes fade{0%{opacity:0;transform:translate(-50%,6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.tap,.tap:after,.toast{animation-duration:.01s}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:0 0 9px;font-weight:600}
.mut{color:var(--mut)}.small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar2{height:10px;border-radius:6px;background:#18213f;position:relative;margin:5px 0 3px;overflow:hidden}.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar2 em{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;border-radius:2px}
.ev{padding:9px 0;border-top:1px solid var(--line)}.ev:first-of-type{border-top:0}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;margin-right:6px}
.tag.bu{background:#0c3a2c;color:var(--grn)}.tag.bd{background:#3d1117;color:var(--red)}.tag.s{background:#2a3358;color:#cfd8f5}
.sig{padding:6px 0}.bar{position:relative;height:7px;border-radius:5px;background:#18213f;margin:4px 0 2px}.bar i{position:absolute;top:0;bottom:0;border-radius:5px}.bar:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#3a4672}
#msg{display:none;text-align:center;padding:30px;color:var(--mut)}
</style></head><body><div class="wrap">
<div class="top"><a class="back" href="markets.html">&#8249; Dashboard</a><span id="chip" class="chip">loading</span></div>
<div id="msg">Waiting for the market agent.</div>
<div id="app" style="display:none">
<div class="strats" id="strats"></div>
<div class="hdr"><div class="btc">&#8383;</div><h1>BTC 15 min</h1><div class="cd" id="cd">-</div></div>
<div class="px"><div><small id="tl">Target</small><b id="target">-</b></div><div><small>Now</small><b id="now">-</b> <span id="diff" class="small"></span></div></div>
<div class="chart"><svg id="chart" viewBox="0 0 360 190" aria-label="Live price chart"></svg></div>
<div class="btns" id="btns"><div class="cell"><button class="bt u" id="bu" type="button">Up &middot; <span id="pu">-</span></button><small class="mut" id="mu"></small></div><div class="cell"><button class="bt d" id="bd" type="button">Down &middot; <span id="pd">-</span></button><small class="mut" id="md"></small></div></div>
<div class="sellrow"><button class="sell" id="bs" type="button">Sell</button></div>

<div class="card"><h2>Its bet right now</h2><div id="pos"></div></div>
<div class="card"><h2>What it is thinking</h2><div id="think"></div></div>
<div class="card"><h2>What it is going off</h2><div id="sigs"></div></div>
<div class="card"><h2>Its moves, newest first</h2><div id="feed"></div></div>
<div class="card"><h2>How recent rounds went</h2><div id="hist"></div></div>
<div class="small mut" style="text-align:center" id="note">Fake money. Information only, not financial advice.</div>
</div></div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tm(t){return new Date(t*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})}
function tm2(t){return new Date(t*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function mo(n){return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function sg(n){return (n>=0?'+':'-')+mo(Math.abs(n))}
var DESC={distance:'Looks only at how far BTC is from the target and how much time is left.',signals:'Distance to target, adjusted by every signal: order book, trend, whales, news and mood.',trend:'Distance to target, adjusted by the recent price trend.',flow:'Distance to target, adjusted by order book and whale flow.',mood:'Distance to target, adjusted by the slow news and market mood.',hold:'Control. Makes one bet at the start and holds it to the end, no matter what.'};
var D=null,SEL=null,seen={},primed={},busy=false,queue=[];
function pick(d){var s=d.sim&&d.sim.strategies||[];if(!SEL){var best=s.filter(function(x){return x.key==='signals'})[0]||s[0];SEL=best&&best.key}return s.filter(function(x){return x.key===SEL})[0]}
function chart(d,S){
 var P=d.path,sim=d.sim,W=360,H=190,L=6,R=54,T=10,B=18,w0=sim.win,w1=w0+900;
 var pts=(P&&P.pts||[]).filter(function(p){return p[0]>=w0}),tg=sim.strike;
 if(!pts.length||!tg){$('chart').innerHTML='<text x="180" y="95" fill="#8a97b8" text-anchor="middle" font-size="13">Collecting this round...</text>';return}
 var vs=pts.map(function(p){return p[1]}).concat([tg]),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),pad=Math.max((mx-mn)*0.25,8);mn-=pad;mx+=pad;
 var X=function(t){return L+(t-w0)/900*(W-L-R)},Y=function(v){return T+(mx-v)/(mx-mn)*(H-T-B)};
 var line=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)}).join('');
 var last=pts[pts.length-1],area=line+'L'+X(last[0]).toFixed(1)+' '+(H-B)+'L'+X(pts[0][0]).toFixed(1)+' '+(H-B)+'Z';
 var s='<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7931a" stop-opacity=".35"/><stop offset="1" stop-color="#f7931a" stop-opacity="0"/></linearGradient></defs>';
 for(var i=0;i<4;i++){var v=mn+(mx-mn)*i/3,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R+4)+'" y1="'+y+'" y2="'+y+'" stroke="#1f2a4a" stroke-width="1"/><text x="'+(W-2)+'" y="'+(y+4)+'" fill="#8a97b8" font-size="10" text-anchor="end">$'+Math.round(v).toLocaleString()+'</text>'}
 var ty=Y(tg);s+='<line x1="'+L+'" x2="'+(W-R+4)+'" y1="'+ty+'" y2="'+ty+'" stroke="#e8edf8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="'+(L+4)+'" y="'+(ty-5)+'" fill="#e8edf8" font-size="10" font-weight="700">TARGET</text>';
 s+='<path d="'+area+'" fill="url(#ga)"/><path d="'+line+'" fill="none" stroke="#f7931a" stroke-width="2" stroke-linejoin="round"/>';
 var evs=(sim.events||[]).filter(function(e){return e.s===SEL&&e.t>=w0});
 evs.forEach(function(e){var p=pts.reduce(function(a,b){return Math.abs(b[0]-e.t)<Math.abs(a[0]-e.t)?b:a});var x=X(e.t),y=Y(p[1]);
  if(e.a==='SELL')s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fff" stroke="#080d1a" stroke-width="1.5"/>';
  else if(e.side==='UP')s+='<path d="M'+x+' '+(y-7)+'L'+(x+6)+' '+(y+4)+'L'+(x-6)+' '+(y+4)+'Z" fill="#0fd68f" stroke="#080d1a" stroke-width="1.2"/>';
  else s+='<path d="M'+x+' '+(y+7)+'L'+(x+6)+' '+(y-4)+'L'+(x-6)+' '+(y-4)+'Z" fill="#ff4d57" stroke="#080d1a" stroke-width="1.2"/>'});
 s+='<circle cx="'+X(last[0])+'" cy="'+Y(last[1])+'" r="4.5" fill="#f7931a" stroke="#fff" stroke-width="1.5"/>';
 s+='<text x="'+L+'" y="'+(H-4)+'" fill="#8a97b8" font-size="10">'+tm2(w0)+'</text><text x="'+(W-R)+'" y="'+(H-4)+'" fill="#8a97b8" font-size="10" text-anchor="end">'+tm2(w1)+'</text>';
 $('chart').innerHTML=s}
function tap(kind,label){var host=kind==='u'?$('bu'):kind==='d'?$('bd'):$('bs');var r=host.getBoundingClientRect(),pr=$('btns').parentNode.getBoundingClientRect();
 var t=document.createElement('div');t.className='tap';t.style.position='fixed';t.style.left=(r.left+r.width/2)+'px';t.style.top=(r.top+r.height/2)+'px';document.body.appendChild(t);
 var a=document.createElement('div');a.className='toast';a.style.position='fixed';a.style.left=(r.left+r.width/2)+'px';a.style.top=(r.top-38)+'px';a.textContent=label;document.body.appendChild(a);
 setTimeout(function(){t.remove();a.remove()},2500)}
function run(){if(busy||!queue.length)return;busy=true;var e=queue.shift();var kind=e.a==='SELL'?'s':(e.side==='UP'?'u':'d');
 tap(kind,(e.a==='BUY'?'Buy ':'Sell ')+e.side+' '+mo(e.d)+' @ '+Math.round(e.px*100)+'¢');setTimeout(function(){busy=false;run()},1300)}
function render(d){
 D=d;var sim=d.sim;if(!sim||!sim.strategies){$('msg').style.display='block';return}
 $('msg').style.display='none';$('app').style.display='block';var S=pick(d),now=Date.now()/1000;
 $('strats').innerHTML=sim.strategies.map(function(x){return '<button class="sb'+(x.key===SEL?' on':'')+'" data-k="'+x.key+'" type="button">'+esc(x.label.replace('Control: open once, hold to the end','Control (hold)'))+' <b style="color:'+(x.pnl>=0?'var(--grn)':'var(--red)')+'">'+(x.pnl>=0?'+':'-')+'$'+Math.abs(x.pnl).toFixed(0)+'</b></button>'}).join('');
 Array.prototype.forEach.call(document.querySelectorAll('.sb'),function(b){b.onclick=function(){SEL=b.dataset.k;queue=[];render(D)}});
 var left=Math.max(0,sim.win+900-now);$('cd').textContent=Math.floor(left/60)+':'+('0'+Math.floor(left%60)).slice(-2);
 $('target').textContent=sim.strike?mo(sim.strike):'-';$('now').textContent=mo(d.price);
 if(sim.strike){var df=d.price-sim.strike;$('diff').textContent=(df>=0?'▲ ':'▼ ')+mo(Math.abs(df));$('diff').className='small '+(df>=0?'up':'dn')}
 var ya=sim.yes[1],yb=sim.yes[0],mid=(ya+yb)/2;
 $('pu').textContent=(mid*100).toFixed(1)+'%';$('pd').textContent=((1-mid)*100).toFixed(1)+'%';$('mu').textContent=(1/ya).toFixed(2)+'x if right';$('md').textContent=(1/(1-yb)).toFixed(2)+'x if right';
 chart(d,S);
 if(S){
  var pos=S.pos;
  $('pos').innerHTML=pos?'<div class="row"><b style="font-size:20px;color:'+(pos.side==='UP'?'var(--grn)':'var(--red)')+'">'+pos.side+'</b><span class="small mut">'+pos.c+' contracts</span></div><div class="row" style="margin-top:6px"><span class="mut">Paid</span><b>'+mo(pos.cost)+'</b></div><div class="row"><span class="mut">Worth if sold now</span><b>'+mo(pos.value)+'</b></div><div class="row"><span class="mut">Gain or loss now</span><b style="color:'+(pos.value-pos.cost>=0?'var(--grn)':'var(--red)')+'">'+sg(pos.value-pos.cost)+'</b></div>':'<div class="mut">No open bet right now.</div>';
  var n=S.now;
  $('think').innerHTML='<div class="small mut" style="margin-bottom:8px">'+esc(DESC[S.key]||'')+'</div>'+(n?'<div class="row small"><span>Its chance of Up</span><b>'+Math.round(n.p*100)+'%</b></div><div class="bar2"><i style="width:'+n.p*100+'%;background:#2a4bb8"></i><em style="left:calc('+((n.ask+n.bid)/2*100)+'% - 1px)"></em></div><div class="small mut">White tick is Kalshi’s price ('+Math.round((n.ask+n.bid)/2*100)+'%). A gap between them is what it trades on.</div><div style="margin-top:10px"><span class="tag s">'+esc(n.act)+'</span> <span class="small">'+esc(n.why)+'</span></div>':'<div class="mut">Joins at the start of the next round.</div>')+'<div class="small mut" style="margin-top:8px">Balance '+mo(S.bal)+' · total '+sg(S.pnl)+' · '+S.windows+' rounds</div>';
  var ev=(sim.events||[]).filter(function(e){return e.s===SEL}).slice(-12).reverse();
  $('feed').innerHTML=ev.length?ev.map(function(e){return '<div class="ev"><div><span class="tag '+(e.a==='SELL'?'s':e.side==='UP'?'bu':'bd')+'">'+e.a+' '+e.side+'</span><b>'+mo(e.d)+'</b> <span class="mut small">at '+Math.round(e.px*100)+'¢ · '+tm(e.t)+'</span></div><div class="small mut" style="margin-top:3px">'+esc(e.why)+'</div></div>'}).join(''):'<div class="mut small">No moves yet.</div>';
  $('hist').innerHTML=S.hist&&S.hist.length?S.hist.slice().reverse().map(function(h){var diff=h.hold==null?null:h.pnl-h.hold;return '<div class="ev"><div class="row"><span>'+tm2(h.t)+' · went <b>'+h.outcome+'</b></span><b style="color:'+(h.pnl>=0?'var(--grn)':'var(--red)')+'">'+sg(h.pnl)+'</b></div>'+(S.key==='hold'||diff==null?'':'<div class="small mut">'+(Math.abs(diff)<0.005?'Same as holding the first bet.':diff>0?'Moving around beat holding the first bet by '+mo(diff)+'.':'Holding the first bet would have done '+mo(-diff)+' better.')+'</div>')+'</div>'}).join(''):'<div class="mut small">No finished rounds yet.</div>';
  // taps for new moves of the chosen strategy
  var mine=(sim.events||[]).filter(function(e){return e.s===SEL});
  if(!primed[SEL]){primed[SEL]=true;seen[SEL]=mine.length?mine[mine.length-1].t:0}
  else{mine.filter(function(e){return e.t>seen[SEL]}).forEach(function(e){queue.push(e);seen[SEL]=Math.max(seen[SEL],e.t)});run()}
 }
 $('sigs').innerHTML=d.signals.map(function(g){if(!g.ok)return '<div class="sig mut small">'+esc(g.label)+': no data</div>';var v=g.score,col=v>=0?'var(--grn)':'var(--red)';return '<div class="sig"><div class="row small"><b>'+esc(g.label)+'</b><span style="color:'+col+'">'+(v>0?'+':'')+Math.round(v*100)+'</span></div><div class="bar"><i style="background:'+col+';width:'+Math.abs(v)*50+'%;'+(v>=0?'left:50%':'right:50%')+'"></i></div><div class="small mut">'+esc(g.detail)+'</div></div>'}).join('')+'<div class="small mut" style="margin-top:6px">Overall mood score '+(d.live.score>0?'+':'')+d.live.score+' of 100.</div>';
 var chip=$('chip');if(d.sample){chip.textContent='sample data';chip.className='chip sample'}else if(now-d.updated>60){chip.textContent='stale';chip.className='chip stale'}else{chip.textContent='live';chip.className='chip live'}
}
function load(){fetch((location.hash==='#sample'?'market.sample.json':'market.json')+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){if(!D)$('msg').style.display='block'})}
load();setInterval(load,3000);setInterval(function(){if(D&&D.sim){var left=Math.max(0,D.sim.win+900-Date.now()/1000);$('cd').textContent=Math.floor(left/60)+':'+('0'+Math.floor(left%60)).slice(-2)}},1000);
</script></body></html>
