<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Markets</title>
<style>
:root{color-scheme:dark;--bg:#080d1a;--card:#101830;--line:#1f2a4a;--tx:#e8edf8;--mut:#8a97b8;--red:#e5484d;--grn:#30a46c;--amb:#e0a93b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:19px;margin:0;letter-spacing:.2px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.live{color:var(--grn);border-color:#245a41}.chip.stale{color:var(--amb);border-color:#6b5320}.chip.sample{color:#7aa7ff;border-color:#2c4a8a}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:0 0 10px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.small{font-size:13px}
#gauge{display:block;width:100%;max-width:340px;margin:0 auto}
.lean{text-align:center;font-size:20px;font-weight:700;margin-top:2px}
.call{display:flex;align-items:center;gap:14px}
.badge{min-width:112px;text-align:center;font-size:24px;font-weight:800;border-radius:12px;padding:10px 8px;border:2px solid var(--line)}
.badge.UP{color:var(--grn);border-color:var(--grn);background:#0d2a1f}.badge.DOWN{color:var(--red);border-color:var(--red);background:#2c1114}.badge.NONE{color:var(--mut)}
.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:#1b6ef3;border-radius:12px;padding:13px;font-weight:700;margin-top:12px}
.sig{padding:9px 0;border-top:1px solid var(--line)}.sig:first-of-type{border-top:0}
.bar{position:relative;height:8px;border-radius:5px;background:#18213f;margin:6px 0 3px}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}.bar:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#3a4672}
.off{opacity:.5}
.hl{padding:7px 0;border-top:1px solid var(--line);font-size:14px}.hl:first-of-type{border-top:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sc b{display:block;font-size:22px}.sc div{background:#0c1328;border-radius:12px;padding:9px 4px}
.rec{display:grid;grid-template-columns:62px 1fr 1fr 24px;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.ok{color:var(--grn)}.no{color:var(--red)}
#msg{display:none;text-align:center;padding:30px 10px;color:var(--mut)}
@media(min-width:700px){.wrap{max-width:640px}}
</style></head><body><div class="wrap">
<header><h1>Markets &middot; BTC 15 min</h1><span id="chip" class="chip">loading</span></header>
<div id="msg">Waiting for the market agent. If you just set this up, give it a minute.</div>
<div id="app" style="display:none">
<div class="card"><div class="row"><div class="price" id="price">-</div><div class="small mut" id="cd">-</div></div>
<svg id="gauge" viewBox="0 0 300 190" aria-label="Bear to bull gauge">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="18" y1="0" x2="282" y2="0"><stop offset="0" stop-color="#e5232a"/><stop offset=".5" stop-color="#7b8499"/><stop offset="1" stop-color="#22b455"/></linearGradient></defs>
<path d="M42 150 A108 108 0 0 1 258 150" fill="none" stroke="url(#g)" stroke-width="48"/>
<g id="needle" style="transform-origin:150px 150px;transition:transform .8s cubic-bezier(.2,.8,.2,1)"><path d="M146 150 L150 38 L154 150 Z" fill="#f3f6ff" stroke="#080d1a" stroke-width="1.5" stroke-linejoin="round"/></g>
<circle cx="150" cy="150" r="11" fill="#080d1a" stroke="#f3f6ff" stroke-width="4"/>
<text x="42" y="176" fill="#e8edf8" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">BEAR</text><text x="258" y="176" fill="#e8edf8" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">BULL</text></svg>
<div class="lean" id="lean">-</div><div class="small mut" style="text-align:center" id="leansub">-</div></div>

<div class="card"><h2>Call for this 15 minutes</h2><div class="call"><div class="badge" id="badge">-</div><div><div id="win" style="font-weight:600">-</div><div class="small mut" id="callsub">-</div></div></div>
<div class="small mut" id="kal" style="margin-top:10px"></div>
<a class="btn" href="https://kalshi.com" target="_blank" rel="noopener">Open Kalshi</a></div>

<div class="card" id="simcard" style="display:none"><div class="row"><h2 style="margin:0">Fake-money simulator</h2><button id="sw" class="chip" style="cursor:pointer;font-size:14px;padding:6px 14px;background:transparent">-</button></div>
<div class="small mut" id="simnote" style="margin:6px 0 10px"></div><div id="simrows"></div><div class="small mut" id="swmsg" style="margin-top:8px"></div></div>
<div class="card"><h2>What it is looking at</h2><div id="sigs"></div></div>
<div class="card"><h2>News vibe</h2><div id="hls"></div></div>
<div class="card"><h2>Paper scorecard</h2><div class="sc" id="sc"></div><div class="small mut" id="scnote" style="margin-top:10px"></div><div id="bysig" style="margin-top:8px"></div></div>
<div class="card"><h2>Recent calls</h2><div id="rec"></div></div>
<div class="card"><h2>What it has learned</h2><div id="learn"></div></div>
<div class="small mut" id="note" style="text-align:center"></div>
</div></div>
<script>
var $=function(i){return document.getElementById(i)};
function tm(t){return new Date(t*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function money(n){return '$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:0})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var D=null;
function leanText(s){return s>=12?['Leaning bullish','var(--grn)']:s<=-12?['Leaning bearish','var(--red)']:['Neutral','var(--mut)']}
function render(d){
 D=d;$('msg').style.display='none';$('app').style.display='block';
 $('price').textContent=money(d.price);
 var s=d.live.score,L=leanText(s);
 $('needle').style.transform='rotate('+(Math.max(-100,Math.min(100,s))*0.9)+'deg)';
 $('lean').textContent=L[0];$('lean').style.color=L[1];
 $('leansub').textContent='Score '+(s>0?'+':'')+s+' of 100 · live, updates every few seconds · data coverage '+Math.round(d.live.confidence*100)+'%';
 var c=d.call;
 if(c){$('badge').textContent=c.call==='NONE'?'NO LEAN':c.call;$('badge').className='badge '+c.call;
  $('win').textContent=tm(c.start)+' to '+tm(c.end)+' · started at '+money(c.price0);
  $('callsub').textContent='Locked at '+tm(c.locked_at)+' with score '+(c.score>0?'+':'')+c.score+'. Resolves when the window ends.'}
 else{$('badge').textContent='WAIT';$('badge').className='badge NONE';$('win').textContent='Next call at '+tm(d.next_window);$('callsub').textContent='The agent only calls at the start of each 15 minutes.'}
 $('kal').textContent=d.kalshi&&d.kalshi.yes_pct!=null?'Kalshi market right now: yes at '+Math.round(d.kalshi.yes_pct)+'¢ ('+esc(d.kalshi.ticker||'')+')':'Kalshi price not available right now.';
 $('sigs').innerHTML=d.signals.map(function(g){
  if(!g.ok)return '<div class="sig off"><div class="row"><b>'+esc(g.label)+'</b><span class="small mut">no data</span></div><div class="small mut">'+esc(g.detail)+'</div></div>';
  var v=g.score,col=v>=0?'var(--grn)':'var(--red)',w=Math.abs(v)*50;
  return '<div class="sig"><div class="row"><b>'+esc(g.label)+'</b><span class="small" style="color:'+col+'">'+(v>0?'+':'')+Math.round(v*100)+'</span></div><div class="bar"><i style="background:'+col+';width:'+w+'%;'+(v>=0?'left:50%':'right:50%')+'"></i></div><div class="small mut">'+esc(g.detail)+'</div></div>'}).join('');
 $('hls').innerHTML=(d.headlines&&d.headlines.length?d.headlines.map(function(h){var col=h.mood==='bull'?'var(--grn)':h.mood==='bear'?'var(--red)':'var(--mut)';return '<div class="hl"><span class="dot" style="background:'+col+'"></span>'+esc(h.title)+'<div class="small mut">'+esc(h.src)+' · '+Math.max(0,h.age_min)+' min ago</div></div>'}).join(''):'<div class="small mut">No recent stories.</div>');
 var sc=d.scorecard,box=function(n,x){return '<div><span class="small mut">'+n+'</span><b>'+(x.pct==null?'-':x.pct+'%')+'</b><span class="small mut">'+x.right+' of '+x.scored+'</span>'+(x.pnl==null?'':'<span class="small" style="display:block;color:'+(x.pnl>=0?'var(--grn)':'var(--red)')+'">'+(x.pnl>=0?'+':'')+'$'+x.pnl.toFixed(2)+' paper</span>')+'</div>'};
 $('sc').innerHTML=box('Today',sc.today)+box('7 days',sc.week)+box('All time',sc.all);
 $('scnote').textContent=sc.all.scored<100?'Only '+sc.all.scored+' scored calls so far. It takes 100 or more before a win rate means much. Kalshi fees mean it must beat 50% by a clear margin.':'Compare this with 50% (a coin flip) plus Kalshi fees.';
 var by=sc.by_signal,keys=Object.keys(by);
 $('bysig').innerHTML=keys.length?'<div class="small mut" style="margin-bottom:4px">Signal hit rates</div>'+keys.map(function(k){var l=(d.signals.filter(function(g){return g.key===k})[0]||{}).label||k;return '<div class="row small"><span>'+esc(l)+'</span><span class="mut">'+by[k].pct+'% of '+by[k].n+'</span></div>'}).join(''):'';
 $('rec').innerHTML=d.recent.length?d.recent.map(function(r){var ok=r.call==='NONE'||r.outcome==='FLAT'?'<span class="mut">-</span>':(r.call===r.outcome?'<span class="ok">✓</span>':'<span class="no">✗</span>');return '<div class="rec"><span class="mut">'+tm(r.start)+'</span><span>Call: '+(r.call==='NONE'?'none':r.call)+'</span><span>Went: '+r.outcome+'</span>'+ok+'</div>'}).join(''):'<div class="small mut">No finished calls yet.</div>';
 var lh='',rm=d.recent_markets;
 if(rm&&rm.length){lh+='<div class="small mut">Kalshi last '+rm.length+' finished markets (newest first)</div><div style="display:flex;gap:4px;margin:6px 0 10px">'+rm.map(function(x){return '<span style="flex:1;height:10px;border-radius:3px;background:'+(x==='UP'?'var(--grn)':'var(--red)')+'"></span>'}).join('')+'</div>'}
 var L=d.learning;
 if(L){lh+='<div class="small" style="margin-bottom:6px">'+esc((L.notes||[]).join(' '))+'</div>';
  var ks=Object.keys(L.signals||{});lh+=ks.map(function(k){var g=L.signals[k],lab=(d.signals.filter(function(x){return x.key===k})[0]||{}).label||k;return '<div class="row small"><span>'+esc(lab)+'</span><span class="mut">'+(g.pct==null?'-':g.pct+'% of '+g.n)+' \u00b7 '+esc(g.verdict)+'</span></div>'}).join('')}
 else{lh+='<div class="small mut">It reviews itself at 4 AM each night. Nothing to report until it has 200 scored calls.</div>'}
 if(d.lessons&&d.lessons.length){lh+='<div class="small mut" style="margin:12px 0 4px">After each call it writes its own review</div>'+d.lessons.map(function(x){return '<div class="hl"><b style="color:'+(x.won===true?'var(--grn)':x.won===false?'var(--red)':'var(--mut)')+'">'+tm(x.start)+'</b> '+esc(x.text)+'</div>'}).join('')}
 $('learn').innerHTML=lh;
 var SM=d.sim;
 if(SM&&SM.strategies){$('simcard').style.display='block';
  $('sw').textContent=SM.on?'ON':'OFF';$('sw').style.color=SM.on?'var(--grn)':'var(--red)';$('sw').style.borderColor=SM.on?'var(--grn)':'var(--red)';
  $('simnote').textContent='Pretend $'+SM.start.toLocaleString()+' per strategy on Kalshi\u2019s live prices. Bets run $'+SM.min_bet+' to $'+SM.cap+', fees and buy/sell gaps counted.'+(SM.synthetic?' Using estimated prices until Kalshi data is reachable.':'');
  $('simrows').innerHTML=SM.strategies.map(function(r,i){var c=r.pnl>=0?'var(--grn)':'var(--red)';return '<div class="sig"'+(i?'':' style="border-top:0"')+'><div class="row"><b>'+esc(r.label)+'</b><span class="small" style="color:'+c+'">'+(r.pnl>=0?'+$':'-$')+Math.abs(r.pnl).toFixed(2)+'</span></div><div class="small mut">$'+r.bal.toFixed(2)+' now \u00b7 '+r.windows+' rounds, '+(r.win_pct==null?'no rounds yet':'won '+r.win_pct+'%')+' \u00b7 '+r.trades+' trades'+(r.key==='hold'?'':' \u00b7 trading beyond the opening bet '+(r.mgmt>=0?'added +$':'cost $')+Math.abs(r.mgmt).toFixed(2))+(r.open?' \u00b7 holding '+r.open:'')+'</div></div>'}).join('')}
 $('note').textContent=d.note||'';tick();
}
function tick(){
 if(!D)return;var now=Date.now()/1000,left=Math.max(0,D.next_window-now),m=Math.floor(left/60),s=Math.floor(left%60);
 $('cd').textContent='Next call in '+m+':'+(s<10?'0':'')+s;
 var chip=$('chip');
 if(D.sample){chip.textContent='sample data';chip.className='chip sample'}
 else if(now-D.updated>120){chip.textContent='stale '+Math.round((now-D.updated)/60)+' min';chip.className='chip stale'}
 else{chip.textContent='live';chip.className='chip live'}
}
function load(){
 var f=location.hash==='#sample'?'market.sample.json':'market.json';
 fetch(f+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){if(!D){$('msg').style.display='block'}else{D.updated=D.updated}})
}
var SWURL=location.protocol+'//'+location.hostname+':8097/';
$('sw').onclick=function(){var on=D&&D.sim?!D.sim.on:true;$('swmsg').textContent='Sending...';
 fetch(SWURL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({on:on})}).then(function(r){return r.json()}).then(function(j){if(j.error)throw 0;$('swmsg').textContent=j.on?'Turned on. It joins the next 15-minute round.':'Turned off. Open bets are being closed and it stops trading.';if(D&&D.sim)D.sim.on=j.on;$('sw').textContent=j.on?'ON':'OFF'}).catch(function(){$('swmsg').textContent='Could not reach the switch. The agent may be restarting.'})};
load();
setInterval(load,15000);setInterval(tick,1000);
</script></body></html>
