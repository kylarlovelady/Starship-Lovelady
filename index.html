<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Control Room, connected station</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050a1c}
button{font-family:inherit}
.roomhit{fill:rgba(255,209,102,0);cursor:pointer;transition:fill .15s}
.roomhit:hover{fill:rgba(255,209,102,0.10)}
</style>
</helmet>
<div id="zoom-root" style="position: relative; width: 2440px; height: 1400px; background: #050a1c; overflow: hidden; touch-action: pan-x pan-y; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e8eeff">
<div id="zoom-station" style="position: absolute; left: 0; top: 0; width: 2440px; height: 1400px; transform-origin: 0 0; transform: {{zStation}}">
<svg width="2440" height="1400" viewBox="0 0 2440 1400" style="position: absolute; left: 0; top: 0" role="img" aria-label="The whole station seen from an angle: seven rooms joined by a hallway. Tap a room to open it.">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="520">
<circle cx="{{s.x}}" cy="{{s.y}}" r="{{s.r}}" style="fill: #ffffff; fill-opacity: {{s.o}}"></circle>
</sc-for>
<sc-for list="{{bg}}" as="c" hint-placeholder-count="6">
<circle cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" style="fill: {{c.fill}}; fill-opacity: {{c.op}}"></circle>
</sc-for>
<sc-for list="{{polys}}" as="p" hint-placeholder-count="3000">
<polygon points="{{p.pts}}" style="fill: {{p.fill}}; stroke: {{p.stroke}}; stroke-width: {{p.sw}}; fill-opacity: {{p.op}}; stroke-linejoin: round; stroke-linecap: round"></polygon>
</sc-for>
<sc-for list="{{circles}}" as="c" hint-placeholder-count="10">
<circle cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" style="fill: {{c.fill}}; fill-opacity: {{c.op}}"></circle>
</sc-for>
<sc-for list="{{roomHits}}" as="h" hint-placeholder-count="7">
<polygon class="roomhit" points="{{h.pts}}" onClick="{{h.go}}" aria-label="{{h.label}}"></polygon>
</sc-for>
<g transform="translate(0,-65)" style="opacity: {{menuOp}}">
<ellipse cx="150" cy="1330" rx="70" ry="8" fill="#7dffb0" fill-opacity="0.10"></ellipse>
<circle cx="150" cy="1268" r="26" fill="#7dffb0" fill-opacity="0.30" stroke="#a8ffd0" stroke-opacity="0.6" stroke-width="2"></circle>
<ellipse cx="150" cy="1296" rx="78" ry="21" fill="#7f8aa3"></ellipse>
<ellipse cx="150" cy="1290" rx="78" ry="19" fill="#aab4cc"></ellipse>
<ellipse cx="150" cy="1296" rx="52" ry="9" fill="#4a5470"></ellipse>
<circle cx="102" cy="1298" r="5" fill="#7dffb0"></circle>
<circle cx="126" cy="1304" r="5" fill="#ffd166"></circle>
<circle cx="150" cy="1306" r="5" fill="#7dffb0"></circle>
<circle cx="174" cy="1304" r="5" fill="#ffd166"></circle>
<circle cx="198" cy="1298" r="5" fill="#7dffb0"></circle>
<text x="150" y="1372" text-anchor="middle" font-size="24" letter-spacing="5" fill="#9fb0d6" fill-opacity="0.8" font-family="Chakra Petch, sans-serif">TABS</text>
<circle cx="150" cy="1296" r="120" fill="#ffffff" fill-opacity="0" onClick="{{menu}}" style="cursor: pointer; pointer-events: {{menuPe}}"></circle>
</g>
</svg>
<sc-for list="{{labels}}" as="t" hint-placeholder-count="60">
<div style="position: absolute; left: {{t.x}}px; top: {{t.y}}px; width: 0; height: 0; pointer-events: none">
<div style="position: absolute; white-space: nowrap; pointer-events: none; font-family: 'Chakra Petch', sans-serif; font-size: {{t.size}}px; font-weight: {{t.weight}}; color: {{t.fill}}; text-shadow: {{t.sh}}; transform: {{t.tf}}; line-height: 1">{{t.text}}</div>
</div>
</sc-for>
<div style="position: absolute; left: 40px; top: 28px; right: 40px; pointer-events: none">
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 20px; letter-spacing: 0.2em; color: #5ce1ff">{{kicker}}</div>
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: 0.04em">{{title}}</div>
<div style="font-size: 20px; color: #9fb0d6; margin-top: 4px">{{sub}}</div>
</div>
</div>
<sc-if value="{{roomOn}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 2440px; height: 1400px; background: rgba(5, 10, 28, 0.94)">
<div id="zoom-room" style="position: absolute; left: 0; top: 0; width: 1280px; height: 900px; transform: {{zRoom}}; transform-origin: 0 0; background: #050a1c; overflow: hidden; border: 2px solid #c9a227; box-sizing: border-box; color: #e8eeff">
<svg width="1280" height="900" viewBox="0 0 1280 900" style="position: absolute; left: 0; top: 0" role="img" aria-label="{{room.title}}">
<sc-for list="{{room.stars}}" as="s" hint-placeholder-count="140">
<circle cx="{{s.x}}" cy="{{s.y}}" r="{{s.r}}" style="fill: #ffffff; fill-opacity: {{s.o}}"></circle>
</sc-for>
<sc-for list="{{room.polys}}" as="p" hint-placeholder-count="900">
<polygon points="{{p.pts}}" style="fill: {{p.fill}}; stroke: {{p.stroke}}; stroke-width: {{p.sw}}; fill-opacity: {{p.op}}; stroke-linejoin: round; stroke-linecap: round"></polygon>
</sc-for>
<sc-for list="{{room.circles}}" as="c" hint-placeholder-count="10">
<circle cx="{{c.x}}" cy="{{c.y}}" r="{{c.r}}" style="fill: {{c.fill}}; fill-opacity: {{c.op}}"></circle>
</sc-for>

</svg>
<sc-for list="{{room.labels}}" as="t" hint-placeholder-count="30">
<div style="position: absolute; left: {{t.x}}px; top: {{t.y}}px; width: 0; height: 0; pointer-events: none">
<div style="position: absolute; white-space: nowrap; pointer-events: none; font-family: 'Chakra Petch', sans-serif; font-size: {{t.size}}px; font-weight: {{t.weight}}; color: {{t.fill}}; text-shadow: {{t.sh}}; transform: {{t.tf}}; line-height: 1">{{t.text}}</div>
</div>
</sc-for>
<div style="position: absolute; left: 28px; top: 16px; right: 200px">
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; letter-spacing: 0.2em; color: #ffd166">{{room.kicker}}</div>
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 0.04em">{{room.title}}</div>
<div style="font-size: 14px; color: #9fb0d6; margin-top: 2px">{{room.sub}}</div>
</div>
<button onClick="{{room.toggleHints}}" style="position: absolute; right: 236px; top: 20px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 2px solid #c9a227; background: #1a1630; color: #ffd166; font-size: 14px; font-weight: 600; cursor: pointer">{{room.hintsLabel}}</button>
<button onClick="{{closeRoom}}" style="position: absolute; right: 24px; top: 20px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 2px solid #5ce1ff; background: #10223e; color: #e8f6ff; font-size: 14px; font-weight: 600; cursor: pointer">Back to the station</button>
<sc-for list="{{room.hits}}" as="h" hint-placeholder-count="10">
<button onClick="{{h.go}}" aria-label="{{h.label}}" style="position: absolute; left: {{h.l}}px; top: {{h.t}}px; width: {{h.w}}px; height: {{h.h}}px; padding: 0; margin: 0; background: transparent; border: {{h.bd}}; border-radius: 10px; cursor: pointer"></button>
</sc-for>
<div style="position: absolute; left: 0; right: 0; bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px">
<div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center">
<sc-for list="{{room.previews}}" as="b" hint-placeholder-count="4">
<button onClick="{{b.go}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 2px solid {{b.edge}}; background: {{b.bg}}; color: #f1f5ff; font-size: 14px; font-weight: 600; cursor: pointer">{{b.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{room.ov.on}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(5, 10, 28, 0.96); overflow-y: auto; padding: 24px 40px; box-sizing: border-box">
<div style="max-width: 1000px; margin: 0 auto">
<button onClick="{{room.ov.back}}" style="min-height: 48px; padding: 0 22px; border-radius: 10px; border: 2px solid #5ce1ff; background: #10223e; color: #e8f6ff; font-size: 16px; font-weight: 600; cursor: pointer">{{room.ov.backLabel}}</button>
<div style="font-family: 'Chakra Petch', sans-serif; font-size: 34px; font-weight: 700; margin-top: 16px; color: #ffd166">{{room.ov.title}}</div>
<div style="font-size: 16px; color: #9fb0d6; margin-bottom: 14px">{{room.ov.sub}}</div>
<sc-for list="{{room.ov.cards}}" as="c" hint-placeholder-count="0">
<button onClick="{{c.go}}" style="display: inline-flex; flex-direction: column; justify-content: space-between; width: 226px; height: 112px; margin: 0 12px 12px 0; padding: 12px 14px; box-sizing: border-box; text-align: left; border-radius: 12px; border: 3px solid {{c.edge}}; background: {{c.bg}}; color: #0a0f24; cursor: pointer; vertical-align: top">
<span style="font-family: 'Chakra Petch', sans-serif; font-size: 20px; font-weight: 700">{{c.name}}</span>
<span style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600"><span>{{c.role}}</span><span style="width: 22px; height: 22px; border-radius: 11px; background: {{c.dot}}; border: 2px solid #0a0f24"></span></span>
</button>
</sc-for>
<sc-for list="{{room.ov.rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; gap: 14px; padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; background: #0f1a36; border-left: 6px solid {{r.edge}}; font-size: 17px; line-height: 1.35">
<div style="width: 210px; flex-shrink: 0; color: #9fb0d6; font-weight: 600">{{r.k}}</div>
<div style="flex-grow: 1">{{r.v}}</div>
</div>
</sc-for>
<div style="margin-top: 10px">
<sc-for list="{{room.ov.actions}}" as="a" hint-placeholder-count="0">
<button onClick="{{a.go}}" style="min-height: 52px; padding: 0 20px; margin: 0 10px 10px 0; border-radius: 10px; border: 2px solid {{a.edge}}; background: {{a.bg}}; color: #f1f5ff; font-size: 16px; font-weight: 600; cursor: pointer">{{a.label}}</button>
</sc-for>
</div>
<div style="font-size: 13px; color: #6f7fa8; margin-top: 12px">{{room.ov.note}}</div>
</div>
</div>
</sc-if>
</div>
</div>
</sc-if>
</div>
</x-dc>
