<title>Lovelady Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: full-screen photo/theme ground, one big glass clock bubble top-left, glass control dock top-right, room chips, grid of glass device tiles. Single glass look, dark-first. */
:root{--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.2);--ink:rgba(255,255,255,.96);--ink2:rgba(255,255,255,.66);--blur:34px;
--font:'Inter',-apple-system,'SF Pro Display',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{margin:0;background:#0b1220;color:var(--ink);font-family:var(--font);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#bg{position:fixed;inset:0;background:#0b1220 center/cover no-repeat;transition:background .6s;z-index:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.flake{position:absolute;top:-20px;color:#fff;opacity:.8;animation:fall linear infinite;font-size:14px}
@keyframes fall{to{transform:translateY(110vh) translateX(40px)}}
@media(prefers-reduced-motion:reduce){.flake{animation:none;display:none}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;gap:14px;min-height:0}
.g{background:linear-gradient(135deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.04) 45%,rgba(255,255,255,.08) 100%);border:1px solid var(--edge);backdrop-filter:blur(var(--blur)) saturate(1.35) brightness(1.08);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.35) brightness(1.08);box-shadow:0 12px 44px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 22px rgba(255,255,255,.04);border-radius:28px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.clock{padding:14px 26px 12px;min-width:0;flex:0 1 auto}
.clock .t{font-size:clamp(48px,9vw,96px);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clock .t small{font-size:.32em;font-weight:500;margin-left:.25em;letter-spacing:0;color:var(--ink2)}
.clock .d{font-size:clamp(14px,2.2vw,22px);color:var(--ink2);margin-top:4px;font-weight:400}
.dock{position:fixed;z-index:25;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px;border-radius:32px;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s}
.ib{width:58px;height:58px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;font-size:12px;font-weight:500;transition:transform .15s,background .2s;flex-direction:column;line-height:1.1;gap:2px;padding:0}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.ib.act{background:var(--glass2)}
.ib.mute{background:rgba(255,120,120,.22);border-color:rgba(255,190,190,.6)}
.ib:focus-visible,.chip:focus-visible,.tile:focus-visible,.kk:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;flex:1;min-width:0}
.chip{padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);white-space:nowrap;font-size:15px;font-weight:500}
.chip.act{background:rgba(255,255,255,.26);color:#fff;border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.search{width:min(260px,100%);padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--ink);font:inherit;font-size:15px;user-select:text;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.search::placeholder{color:var(--ink2)}
.grid{flex:1;min-height:0;overflow-y:auto;transition:padding .3s;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start;padding:2px 2px 110px;scrollbar-width:none}
.tile{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:136px;text-align:left;transition:background .25s,transform .15s}
.tile:active{transform:scale(.98)}
.tile.on{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border-color:rgba(255,255,255,.6)}
.tile .h{display:flex;align-items:center;gap:10px}
.ico{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile.on .ico{background:rgba(255,255,255,.88);color:#223}
.tile .n{font-weight:500;font-size:16px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--ink2)}
.tile .v{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.sl{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);outline:none;margin:0;overflow:hidden}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:-400px 0 0 392px rgba(255,255,255,.32),0 2px 8px rgba(0,0,0,.35)}
.sl::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:0}
.sl::-moz-range-progress{background:rgba(255,255,255,.32);height:30px}
.row{display:flex;gap:8px;align-items:center}
.pm{width:44px;height:44px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);font-size:22px;line-height:1}
.pm:active{transform:scale(.92)}
.sw{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:background .2s;margin-left:auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s}
.tile.on .sw{background:rgba(255,255,255,.75)}
.tile.on .sw::after{transform:translateX(20px)}
.panel{position:fixed;z-index:20;left:50%;bottom:96px;transform:translate(-50%,0);width:min(680px,calc(100% - 32px));padding:18px;display:none}
.panel.open{display:block}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:600}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.th{height:68px;border-radius:18px;border:2px solid rgba(255,255,255,.35);background-size:cover;background-position:center;font-size:13px;font-weight:600;display:flex;align-items:flex-end;padding:8px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.th.act{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.pbtn{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.pill{padding:12px 20px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);font-size:15px;font-weight:500}
.kb{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:96px;width:min(900px,calc(100% - 24px));padding:12px;display:none;border-radius:30px}
.kb.open{display:block}
.kr{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.kk{flex:1;max-width:64px;height:46px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);font-size:18px;font-weight:500}
.kk.w{max-width:none;flex:3}.kk.m{max-width:96px;flex:1.5}
.kk:active{background:rgba(255,255,255,.5)}
.toast{position:fixed;z-index:40;left:50%;top:14px;transform:translateX(-50%);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.demo{position:fixed;z-index:15;left:16px;top:10px;display:none;font-size:12px;color:var(--ink2);padding:6px 12px;border-radius:999px}
body.kiosk .demo{display:none}
.saver{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .8s .15s}
.saver .g{padding:30px 56px 26px;text-align:center;border-radius:44px}
.saver .t{font-size:clamp(72px,17vw,210px);font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.saver .t small{font-size:.22em;font-weight:400;margin-left:.2em;color:var(--ink2)}
.saver .d{font-size:clamp(18px,3.4vw,38px);font-weight:300;color:var(--ink2);margin-top:8px}
#app{transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
body.kiosk #app{transform:translateY(-108%);opacity:0;pointer-events:none}
body.kiosk .dock{transform:translate(-50%,160%);opacity:0;pointer-events:none}
body.kiosk .saver{opacity:1}
body.kiosk .panel,body.kiosk .kb{display:none}
body.kb-open .grid{padding-bottom:330px}
.seg{display:flex;padding:5px;gap:4px;border-radius:999px;align-self:flex-start;margin-left:auto}
.seg button{padding:10px 20px;border-radius:999px;background:transparent;border:0;font-size:15px;font-weight:500;color:var(--ink2)}
.seg button.act{background:rgba(255,255,255,.24);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.svg-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-content:start;padding:2px 2px 110px;scrollbar-width:none}
.sv{padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.sv.act{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border-color:rgba(255,255,255,.6)}
.sv .pv{height:90px;border-radius:18px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-weight:200;font-size:30px;background:rgba(0,0,0,.25);overflow:hidden}
.sv .n{font-weight:500}.sv .s{font-size:13px;color:var(--ink2)}
.note{font-size:13px;color:var(--ink2);padding:0 6px}
#stars{position:fixed;inset:0;z-index:2;display:none;pointer-events:none}
body.kiosk.sv-stars #stars{display:block}
body.kiosk.sv-dim #bg{filter:brightness(.18)}
body.kiosk.sv-black #bg{filter:brightness(0)}
body.kiosk.sv-black #fx{display:none}
body.kiosk.sv-dim .saver .g,body.kiosk.sv-black .saver .g{background:none;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body.kiosk.sv-black .saver .t,body.kiosk.sv-dim .saver .t{font-size:clamp(48px,9vw,110px);opacity:.55}
body.kiosk.sv-black .saver .d,body.kiosk.sv-dim .saver .d{opacity:.45}
body.kiosk.sv-cycle #bg{transition:background 3s}
body.kiosk.sv-nodate .saver .d{display:none}
body.page-saver .sub,body.page-saver #grid{display:none}
body:not(.page-saver) #svgrid,body:not(.page-saver) #svnote{display:none}
@media(max-width:560px){.ib{width:48px;height:48px;border-radius:16px}.clock{padding:12px 18px}.dock{gap:4px;padding:6px}}
</style>

<div id="bg"></div><div id="fx"></div>
<div id="app">
  <div class="top">
    <div class="g clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
    <div class="g seg" id="seg"><button class="act" data-p="dev">Devices</button><button data-p="sav">Screensaver</button></div>
  </div>
  <div class="sub" id="subrow"><div class="chips" id="chips"></div><input class="search" id="q" placeholder="Search devices" autocomplete="off"></div>
  <div class="grid" id="grid"></div>
  <div class="note" id="svnote">Kiosk screensaver. Pick one, then tap Kiosk or double-tap to try it. The desktop screensaver is always the ocean waves.</div>
  <div class="svg-grid" id="svgrid"></div>
</div>

<canvas id="stars"></canvas>
<div class="g dock">
      <button class="ib" id="bMic" aria-label="Mute microphone"><svg viewBox="0 0 24 24" id="micSvg"></svg><span id="micLbl">Mic on</span></button>
      <button class="ib" id="bTheme" aria-label="Change background"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg><span>Theme</span></button>
      <button class="ib" id="bKey" aria-label="Keyboard"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span>Keys</span></button>

    </div>
<div class="saver"><div class="g"><div class="t" id="time2">--:--</div><div class="d" id="date2"></div></div></div>
<div class="g panel" id="panel"><h3>Background</h3><div class="themes" id="themes"></div>
  <div class="pbtn"><label class="pill" for="file">Add family photo</label><input type="file" id="file" accept="image/*" hidden><button class="pill" id="pClose">Done</button></div></div>
<div class="g kb" id="kb"></div>
<div class="g toast" id="toast"></div>
<div class="g demo">Demo data. Double-tap empty space to slide the menu away or back.</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var ICON={light:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',
switch:'<path d="M12 3v8M6.5 6.5a8 8 0 1011 0"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
climate:'<path d="M14 14.5V5a2 2 0 00-4 0v9.5a4 4 0 104 0z"/>',cover:'<path d="M4 4h16M6 4v4h12V4M6 8v4h12V8M6 12v4h12v-4"/>',
media:'<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',scene:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',

var MIC_ON='<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>';
var MIC_OFF='<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M3 3l18 18"/>';
var DEV=[
{id:'l1',t:'light',n:'Kitchen lights',r:'Kitchen',on:true,b:80},
{id:'l2',t:'light',n:'Living room lamp',r:'Living room',on:true,b:55},
{id:'l3',t:'light',n:'Living room ceiling',r:'Living room',on:false,b:100},
{id:'l4',t:'light',n:'Bedroom lights',r:'Bedroom',on:false,b:40},

{id:'c1',t:'climate',n:'Thermostat',r:'Living room',cur:71,set:72,mode:'Heat'},
{id:'k1',t:'lock',n:'Front door',r:'Outside',on:true},
{id:'k2',t:'lock',n:'Back door',r:'Outside',on:true},
{id:'v1',t:'cover',n:'Garage door',r:'Outside',on:false},
{id:'m1',t:'media',n:'Living room TV',r:'Living room',on:false,vol:30},
{id:'m2',t:'media',n:'Kitchen speaker',r:'Kitchen',on:true,vol:45},
{id:'s1',t:'switch',n:'Coffee maker',r:'Kitchen',on:false},
{id:'s2',t:'switch',n:'Christmas tree',r:'Living room',on:true},
{id:'f1',t:'fan',n:'Bedroom fan',r:'Bedroom',on:false,b:50},
{id:'sc1',t:'scene',n:'Movie night',r:'Scenes'},
{id:'sc2',t:'scene',n:'Good night',r:'Scenes'},
{id:'sc3',t:'scene',n:'Leaving home',r:'Scenes'}];

var room='All',query='';

{k:'aurora',n:'Aurora',bg:'radial-gradient(1200px 700px at 20% 10%,#2ee6a8 0,transparent 55%),radial-gradient(1000px 700px at 85% 20%,#7a5cff 0,transparent 55%),linear-gradient(160deg,#06122b,#0d2a4a 60%,#0a1a33)'},

 var t=THEMES.filter(function(x){return x.k===theme})[0]||THEMES[0];
 $('bg').style.background=(theme==='photo'&&photo)?'center/cover no-repeat url('+photo+')':t.bg;

  var el=document.createElement('div');el.className='g tile'+(d.on?' on':'');el.tabIndex=0;

  if(d.t==='light'||d.t==='switch'||d.t==='fan'||d.t==='media'||d.t==='lock'||d.t==='cover')h+='<span class="sw"></span>';
  h+='</div>';
  if(d.t==='light'||d.t==='fan')h+='<input class="sl" type="range" min="1" max="100" value="'+d.b+'" aria-label="Level">';
  if(d.t==='media')h+='<input class="sl" type="range" min="0" max="100" value="'+d.vol+'" aria-label="Volume">';
  if(d.t==='climate')h+='<div class="row"><button class="pm" data-a="-">−</button><div class="v" style="flex:1;text-align:center">'+d.set+'°</div><button class="pm" data-a="+">+</button></div><div class="s">Inside now '+d.cur+'°F</div>';
  el.innerHTML=h;
  var sw=el.querySelector('.sw');
  function flip(){if(d.t==='scene'){toast(d.n+' started');return}if(d.t==='climate')return;d.on=!d.on;render()}
  el.onclick=function(e){if(e.target.closest('input,.pm'))return;flip()};
  el.onkeydown=function(e){if(e.key==='Enter'&&e.target===el)flip()};
  var sl=el.querySelector('.sl');
  if(sl){sl.oninput=function(){if(d.t==='media')d.vol=+sl.value;else{d.b=+sl.value;d.on=true}};sl.onchange=function(){render()}}
  el.querySelectorAll('.pm').forEach(function(b){b.onclick=function(){d.set+=b.dataset.a==='+'?1:-1;render()}});
  g.appendChild(el)});
}
