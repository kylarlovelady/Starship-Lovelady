<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lovelady Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: photo/video ground with slow wave motion, small clear glass clock, glass pages (Devices, Backgrounds), floating glass taskbar, glass keyboard only when typing. Single misty glass look. */
:root{--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.2);--ink:rgba(255,255,255,.96);--ink2:rgba(255,255,255,.66);--blur:42px;--font:'Inter',-apple-system,'SF Pro Display',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{margin:0;background:#0b1220;color:var(--ink);font-family:var(--font);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#bgwrap{position:fixed;inset:0;z-index:0;background:#06101c;overflow:hidden;transition:filter 2s ease}
.bgl{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transition:opacity 2.6s ease;animation:drift 80s ease-in-out infinite alternate}
.bgl.on{opacity:1}
.bgl video{width:100%;height:100%;object-fit:cover}
#bgw{position:absolute;inset:-4%;background:center/cover no-repeat url(ocean.jpg);opacity:0;mix-blend-mode:normal;transition:opacity 2.6s ease;animation:swell 23s ease-in-out infinite alternate}
#bgw.on{opacity:.42}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.1) translate(-2.2%,-1.4%)}}
@keyframes swell{0%{transform:scale(1.09) translate(2.4%,.6%) rotate(.3deg)}50%{transform:scale(1.05) translate(-.8%,-1.6%) rotate(-.2deg)}100%{transform:scale(1.1) translate(-2.6%,.9%) rotate(.25deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.flake{position:absolute;top:-20px;color:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(40px)}}
@media(prefers-reduced-motion:reduce){.flake,.bgl,#bgw{animation:none}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;gap:14px;min-height:0;transition:filter .9s ease,opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.g{background:linear-gradient(135deg,rgba(255,255,255,.16) 0,rgba(255,255,255,.04) 45%,rgba(255,255,255,.08) 100%);border:1px solid var(--edge);backdrop-filter:blur(var(--blur)) saturate(1.9) brightness(1.12);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.9) brightness(1.12);box-shadow:0 12px 44px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 22px rgba(255,255,255,.04);border-radius:28px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.clock{padding:6px 20px 8px;flex:0 0 auto;width:fit-content;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.015) 55%,rgba(255,255,255,.05));backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 6px 24px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.05)}
.clock .t{font-size:clamp(44px,8vw,84px);text-shadow:0 2px 14px rgba(0,0,0,.35);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.t small{font-size:.32em;font-weight:500;margin-left:.25em;letter-spacing:0;color:var(--ink2)}
.clock .d{font-size:clamp(14px,2vw,20px);color:var(--ink);text-shadow:0 1px 8px rgba(0,0,0,.4)}
.seg{display:flex;padding:5px;gap:4px;border-radius:999px;margin-left:auto}
.seg button{padding:10px 20px;border-radius:999px;background:transparent;border:0;font-size:15px;font-weight:500;color:var(--ink2)}
.seg button.act{background:rgba(255,255,255,.24);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.dock{position:fixed;z-index:25;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px;border-radius:32px;transition:filter .8s ease,opacity .7s ease}
.ib{width:62px;height:58px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;font-size:12px;font-weight:500;transition:transform .15s,background .2s;line-height:1.1;gap:2px;padding:4px 0 2px}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.ib.mute{background:rgba(255,120,120,.22);border-color:rgba(255,190,190,.6)}
.ib:focus-visible,.chip:focus-visible,.tile:focus-visible,.kk:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;flex:1;min-width:0}
.chip{padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);white-space:nowrap;font-size:15px;font-weight:500}
.chip.act{background:rgba(255,255,255,.26);color:#fff;border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.search{width:min(260px,100%);padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--ink);font:inherit;font-size:15px;user-select:text;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.search::placeholder{color:var(--ink2)}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:2px 6px 120px 2px;transition:filter .45s ease,opacity .45s ease,transform .45s ease,padding .3s}
.scroller::-webkit-scrollbar{width:6px}.scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start}
body.kb-open .scroller{padding-bottom:340px}
.tile{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:136px;text-align:left;transition:background .25s,transform .15s}
.tile:active{transform:scale(.98)}
.tile.on{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border-color:rgba(255,255,255,.6)}
.tile .h{display:flex;align-items:center;gap:10px}
.ico{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile.on .ico{background:rgba(255,255,255,.88);color:#223}
.tile .n{font-weight:500;font-size:16px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--ink2)}
.tile .v{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.sl{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);outline:none;margin:0;overflow:hidden}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:-400px 0 0 392px rgba(255,255,255,.32),0 2px 8px rgba(0,0,0,.35)}
.sl::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:0}
.sl::-moz-range-progress{background:rgba(255,255,255,.32);height:30px}
.row{display:flex;gap:8px;align-items:center}
.pm{width:44px;height:44px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);font-size:22px;line-height:1}
.pm:active{transform:scale(.92)}
.sw{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:background .2s;margin-left:auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s}
.on>.h>.sw,.sw.is-on{background:rgba(255,255,255,.75)}
.on>.h>.sw::after,.sw.is-on::after{transform:translateX(20px)}
/* backgrounds page */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.card{padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:16px;font-weight:600}.card p{margin:0;font-size:13px;color:var(--ink2);line-height:1.35}
.pill{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);font-size:15px;font-weight:500;text-align:center}
.step{display:flex;align-items:center;gap:10px}.step .val{min-width:56px;text-align:center;font-size:20px;font-weight:300;font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.th{position:relative;aspect-ratio:16/10;border-radius:20px;border:2px solid rgba(255,255,255,.28);background-size:cover;background-position:center;overflow:hidden;padding:0;text-align:left}
.th.act{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.th .l{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 7px;font-size:12px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.55));text-shadow:0 1px 6px rgba(0,0,0,.7)}
.th .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.4);font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.sec{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:6px 4px 10px}
.note{font-size:13px;color:var(--ink2);padding:0 4px 10px}
.hide{display:none!important}
/* keyboard only when typing */
.kb{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:96px;width:min(900px,calc(100% - 24px));padding:12px;display:none;border-radius:30px}
.kb.open{display:block}
.kr{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.kk{flex:1;max-width:64px;height:46px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);font-size:18px;font-weight:500}
.kk.w{max-width:none;flex:3}.kk.m{max-width:96px;flex:1.5}
.kk:active{background:rgba(255,255,255,.5)}
.toast{position:fixed;z-index:40;left:50%;top:14px;transform:translateX(-50%);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
/* kiosk: menu dissolves into fog, big clear clock over the background, dim at night */
.saver{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .8s .15s}
.saver .g{padding:10px 34px 14px;text-align:center;border-radius:40px;width:fit-content;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.015) 55%,rgba(255,255,255,.05));backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 6px 24px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.05);filter:blur(22px);transform:scale(.96);transition:filter 1s ease .1s,transform 1.1s cubic-bezier(.2,.8,.2,1) .1s}
.saver .t{text-shadow:0 3px 24px rgba(0,0,0,.4);font-size:clamp(72px,17vw,210px);font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.saver .t small{font-size:.22em;font-weight:400;margin-left:.2em;color:var(--ink2)}
.saver .d{font-size:clamp(18px,3.4vw,38px);font-weight:300;color:var(--ink);text-shadow:0 2px 12px rgba(0,0,0,.4)}
body.kiosk #app{filter:blur(26px);opacity:0;transform:scale(1.04);pointer-events:none}
body.kiosk .dock{filter:blur(18px);opacity:0;pointer-events:none}
body.kiosk .kb{display:none}
body.kiosk .saver{opacity:1}
body.kiosk .saver .g{filter:none;transform:none}
body.dimmed #bgwrap{filter:brightness(.2)}
body.dimmed .saver .g{background:none;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body.dimmed .saver .t{font-size:clamp(48px,9vw,110px);opacity:.6}
body.dimmed .saver .d{opacity:.5}
body.pure .saver{display:none}
/* page switching: fog dissolve */
.fogout{filter:blur(22px);opacity:0;transform:scale(1.025)}
.fogin>*{animation:fogin .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes fogin{from{filter:blur(20px);opacity:0;transform:translateY(14px) scale(.97)}to{filter:none;opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fogin>*{animation:none}}
@media(max-width:560px){.ib{width:48px;height:48px;border-radius:16px}.dock{gap:4px;padding:6px}}
</style>

<div id="bgwrap"><div class="bgl" id="bgA"></div><div class="bgl" id="bgB"></div><div id="bgw"></div></div>
<div id="fx"></div>
<div id="app">
  <div class="top">
    <div class="clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
    <div class="g seg" id="seg"><button class="act" data-p="dev">Devices</button><button data-p="bg">Backgrounds</button></div>
  </div>
  <div id="pDev" class="page" style="display:contents">
    <div class="sub"><div class="chips" id="chips"></div><input class="search" id="q" placeholder="Search devices" autocomplete="off" inputmode="none"></div>
    <div class="scroller" id="s1"><div class="grid" id="grid"></div></div>
  </div>
  <div id="pBg" class="scroller hide">
    <div class="note" id="bgnote"></div>
    <div class="opts">
      <div class="g card"><h3>Add photos and videos</h3><p>Pick as many as you like from this device. They are saved on the Hub and can be your background.</p>
        <label class="pill" for="file">Choose from photos</label><input type="file" id="file" accept="image/*,video/*" multiple hidden></div>
      <div class="g card"><h3>Cycle through my files</h3><p id="cycP"></p>
        <div class="row"><span class="sw" id="cycSw" role="switch" tabindex="0" aria-label="Cycle backgrounds" style="margin-left:0"></span><div class="step" style="margin-left:auto"><button class="pm" id="mMin">−</button><span class="val" id="minVal"></span><button class="pm" id="pMin">+</button></div></div></div>
      <div class="g card"><h3>Kiosk dim</h3><p>In kiosk mode the screen stays dark and quiet between these hours.</p>
        <div class="row" style="justify-content:space-between"><div class="step"><button class="pm" data-d="from-">−</button><span class="val" id="dFrom"></span><button class="pm" data-d="from+">+</button></div><span style="color:var(--ink2)">to</span><div class="step"><button class="pm" data-d="to-">−</button><span class="val" id="dTo"></span><button class="pm" data-d="to+">+</button></div></div></div>
    </div>
    <div class="sec">Themes</div><div class="thumbs" id="themes"></div>
    <div class="sec" id="myHead">My photos and videos</div><div class="thumbs" id="mine"></div>
  </div>
</div>
<div class="g dock" id="dock">
  <button class="ib" id="bMic" aria-label="Mute microphone"><svg viewBox="0 0 24 24" id="micSvg"></svg><span id="micLbl">Mic on</span></button>
  <button class="ib" id="bTheme" aria-label="Backgrounds"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg><span>Photos</span></button>
  <button class="ib" id="bFull" aria-label="Kiosk mode"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Kiosk</span></button>
</div>
<div class="saver"><div class="g"><div class="t" id="time2">--:--</div><div class="d" id="date2"></div></div></div>
<div class="g kb" id="kb"></div>
<div class="g toast" id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var ICON={light:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>',switch:'<path d="M12 3v8M6.5 6.5a8 8 0 1011 0"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',climate:'<path d="M14 14.5V5a2 2 0 00-4 0v9.5a4 4 0 104 0z"/>',cover:'<path d="M4 4h16M6 4v4h12V4M6 8v4h12V8M6 12v4h12v-4"/>',media:'<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',scene:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',fan:'<circle cx="12" cy="12" r="2"/><path d="M12 10c0-5 5-6 5-3s-3 3-5 3zM14 12c5 0 6 5 3 5s-3-3-3-5zM12 14c0 5-5 6-5 3s3-3 5-3zM10 12c-5 0-6-5-3-5s3 3 3 5z"/>'};
var MIC_ON='<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',MIC_OFF='<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M3 3l18 18"/>';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},2200)}
/* ---------- devices (demo data until wired to Home Assistant) ---------- */
var DEV=[{id:'l1',t:'light',n:'Kitchen lights',r:'Kitchen',on:true,b:80},{id:'l2',t:'light',n:'Living room lamp',r:'Living room',on:true,b:55},{id:'l3',t:'light',n:'Living room ceiling',r:'Living room',on:false,b:100},{id:'l4',t:'light',n:'Bedroom lights',r:'Bedroom',on:false,b:40},{id:'l5',t:'light',n:'Porch light',r:'Outside',on:true,b:100},{id:'l6',t:'light',n:'Garage lights',r:'Outside',on:false,b:100},{id:'c1',t:'climate',n:'Thermostat',r:'Living room',cur:71,set:72,mode:'Heat'},{id:'k1',t:'lock',n:'Front door',r:'Outside',on:true},{id:'k2',t:'lock',n:'Back door',r:'Outside',on:true},{id:'v1',t:'cover',n:'Garage door',r:'Outside',on:false},{id:'m1',t:'media',n:'Living room TV',r:'Living room',on:false,vol:30},{id:'m2',t:'media',n:'Kitchen speaker',r:'Kitchen',on:true,vol:45},{id:'s1',t:'switch',n:'Coffee maker',r:'Kitchen',on:false},{id:'s2',t:'switch',n:'Christmas tree',r:'Living room',on:true},{id:'f1',t:'fan',n:'Bedroom fan',r:'Bedroom',on:false,b:50},{id:'sc1',t:'scene',n:'Movie night',r:'Scenes'},{id:'sc2',t:'scene',n:'Good night',r:'Scenes'},{id:'sc3',t:'scene',n:'Leaving home',r:'Scenes'}];
var rooms=['All'];DEV.forEach(function(d){if(rooms.indexOf(d.r)<0)rooms.push(d.r)});
var room='All',query='';
function ico(t){return '<span class="ico"><svg viewBox="0 0 24 24">'+(ICON[t]||ICON.switch)+'</svg></span>'}
function state(d){if(d.t==='lock')return d.on?'Locked':'Unlocked';if(d.t==='cover')return d.on?'Open':'Closed';if(d.t==='climate')return d.mode;if(d.t==='scene')return 'Tap to run';if(d.t==='media')return d.on?'Playing':'Off';if(d.t==='light')return d.on?d.b+'%':'Off';return d.on?'On':'Off'}
function render(){var g=$('grid');g.innerHTML='';
 DEV.filter(function(d){return(room==='All'||d.r===room)&&(!query||(d.n+' '+d.r).toLowerCase().indexOf(query)>=0)}).forEach(function(d){
  var el=document.createElement('div');el.className='g tile'+(d.on?' on':'');el.tabIndex=0;
  var h='<div class="h">'+ico(d.t)+'<div><div class="n">'+d.n+'</div><div class="s">'+d.r+' · '+state(d)+'</div></div>';
  if(['light','switch','fan','media','lock','cover'].indexOf(d.t)>=0)h+='<span class="sw"></span>';h+='</div>';
  if(d.t==='light'||d.t==='fan')h+='<input class="sl" type="range" min="1" max="100" value="'+d.b+'" aria-label="Level">';
  if(d.t==='media')h+='<input class="sl" type="range" min="0" max="100" value="'+d.vol+'" aria-label="Volume">';
  if(d.t==='climate')h+='<div class="row"><button class="pm" data-a="-">−</button><div class="v" style="flex:1;text-align:center">'+d.set+'°</div><button class="pm" data-a="+">+</button></div><div class="s">Inside now '+d.cur+'°F</div>';
  el.innerHTML=h;
  function flip(){if(d.t==='scene'){toast(d.n+' started');return}if(d.t==='climate')return;d.on=!d.on;render()}
