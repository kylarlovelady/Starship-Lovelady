<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: full-screen photo/theme ground, one big glass clock bubble top-left, glass control dock top-right, room chips, grid of glass device tiles. Single glass look, dark-first. */
:root{--glass:rgba(255,255,255,.14);--glass2:rgba(255,255,255,.22);--edge:rgba(255,255,255,.38);--ink:#fff;--ink2:rgba(255,255,255,.72);--on:#ffd36a;--good:#7cf3b0;--bad:#ff7a7a;--blur:26px;
--font:'Inter',-apple-system,'SF Pro Display',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{margin:0;background:#0b1220;color:var(--ink);font-family:var(--font);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#bg{position:fixed;inset:0;background:#0b1220 center/cover no-repeat;transition:background .6s;z-index:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.flake{position:absolute;top:-20px;color:#fff;opacity:.8;animation:fall linear infinite;font-size:14px}
@keyframes fall{to{transform:translateY(110vh) translateX(40px)}}
@media(prefers-reduced-motion:reduce){.flake{animation:none;display:none}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;gap:14px;min-height:0}
.g{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(var(--blur)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);box-shadow:0 10px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08);border-radius:28px}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.clock{padding:14px 26px 12px;min-width:0;flex:0 1 auto}
.clock .t{font-size:clamp(48px,9vw,96px);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clock .t small{font-size:.32em;font-weight:500;margin-left:.25em;letter-spacing:0;color:var(--ink2)}
.clock .d{font-size:clamp(14px,2.2vw,22px);color:var(--ink2);margin-top:4px;font-weight:400}
.dock{margin-left:auto;display:flex;gap:10px;align-items:center;padding:10px;flex-wrap:wrap;justify-content:flex-end;align-self:flex-start}
.ib{width:58px;height:58px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;font-size:12px;font-weight:500;transition:transform .15s,background .2s;flex-direction:column;line-height:1.1;gap:2px;padding:0}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.ib.act{background:var(--glass2)}
.ib.mute{background:rgba(255,90,90,.45);border-color:rgba(255,160,160,.8)}
.ib:focus-visible,.chip:focus-visible,.tile:focus-visible,.kk:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;flex:1;min-width:0}
.chip{padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);white-space:nowrap;font-size:15px;font-weight:500}
.chip.act{background:rgba(255,255,255,.9);color:#10203a;border-color:#fff}
.search{width:min(260px,100%);padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--ink);font:inherit;font-size:15px;user-select:text;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.search::placeholder{color:var(--ink2)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start;padding:2px 2px 90px;scrollbar-width:none}
.tile{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:136px;text-align:left;transition:background .25s,transform .15s}
.tile:active{transform:scale(.98)}
.tile.on{background:rgba(255,255,255,.30);border-color:rgba(255,255,255,.7)}
.tile .h{display:flex;align-items:center;gap:10px}
.ico{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile.on .ico{background:var(--on);color:#4a3200}
.tile .n{font-weight:500;font-size:16px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--ink2)}
.tile .v{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.sl{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);outline:none;margin:0;overflow:hidden}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:-400px 0 0 392px rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.35)}
.sl::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:0}
.sl::-moz-range-progress{background:rgba(255,255,255,.55);height:30px}
.row{display:flex;gap:8px;align-items:center}
.pm{width:44px;height:44px;border-radius:16px;background:var(--glass2);border:1px solid var(--edge);font-size:22px;line-height:1}
.pm:active{transform:scale(.92)}
.sw{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:background .2s;margin-left:auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s}
.tile.on .sw{background:var(--good)}
.tile.on .sw::after{transform:translateX(20px)}
.panel{position:fixed;z-index:20;left:50%;bottom:16px;transform:translate(-50%,0);width:min(680px,calc(100% - 32px));padding:18px;display:none}
.panel.open{display:block}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:600}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.th{height:68px;border-radius:18px;border:2px solid rgba(255,255,255,.35);background-size:cover;background-position:center;font-size:13px;font-weight:600;display:flex;align-items:flex-end;padding:8px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.th.act{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.pbtn{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.pill{padding:12px 20px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);font-size:15px;font-weight:500}
.kb{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:12px max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));display:none;border-radius:28px 28px 0 0}
.kb.open{display:block}
.kr{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.kk{flex:1;max-width:64px;height:46px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);font-size:18px;font-weight:500}
.kk.w{max-width:none;flex:3}.kk.m{max-width:96px;flex:1.5}
.kk:active{background:rgba(255,255,255,.5)}
.toast{position:fixed;z-index:40;left:50%;top:14px;transform:translateX(-50%);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.demo{position:fixed;z-index:15;left:16px;bottom:10px;font-size:12px;color:var(--ink2);padding:6px 12px;border-radius:999px}
body.kiosk .demo{display:none}
@media(max-width:560px){.ib{width:48px;height:48px;border-radius:16px}.clock{padding:12px 18px}.dock{align-self:stretch;justify-content:center}}
</style>

<div id="bg"></div><div id="fx"></div>
<div id="app">
  <div class="top">
    <div class="g clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
    <div class="g dock">

{id:'sc2',t:'scene',n:'Good night',r:'Scenes'},
{id:'sc3',t:'scene',n:'Leaving home',r:'Scenes'}];
var rooms=['All'];DEV.forEach(function(d){if(rooms.indexOf(d.r)<0)rooms.push(d.r)});
var room='All',query='';
var THEMES=[
{k:'aurora',n:'Aurora',bg:'radial-gradient(1200px 700px at 20% 10%,#2ee6a8 0,transparent 55%),radial-gradient(1000px 700px at 85% 20%,#7a5cff 0,transparent 55%),linear-gradient(160deg,#06122b,#0d2a4a 60%,#0a1a33)'},

{k:'hallo',n:'Halloween',bg:'radial-gradient(800px 600px at 50% 90%,#ff7a00 0,transparent 55%),linear-gradient(180deg,#0b0414,#2a0f3d 65%,#3d1a05)'},
{k:'july',n:'4th of July',bg:'radial-gradient(800px 600px at 10% 20%,#e63946 0,transparent 55%),radial-gradient(800px 600px at 90% 80%,#2a5bd7 0,transparent 55%),linear-gradient(160deg,#0a1330,#1a2250)'},
{k:'spring',n:'Spring',bg:'radial-gradient(900px 600px at 30% 20%,#ffc4de 0,transparent 55%),linear-gradient(160deg,#6ad1a6,#b6e8a0 60%,#f5f0a0)'},
{k:'night',n:'Midnight',bg:'linear-gradient(160deg,#05070d,#0e1626 60%,#060a14)'}];
var theme='aurora',photo=null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function applyTheme(){
 var t=THEMES.filter(function(x){return x.k===theme})[0]||THEMES[0];
 $('bg').style.background=(theme==='photo'&&photo)?'center/cover no-repeat url('+photo+')':t.bg;
 var fx=$('fx');fx.innerHTML='';
 if(t.fx&&theme!=='photo'){for(var i=0;i<26;i++){var s=document.createElement('div');s.className='flake';s.textContent=t.fx;s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(8+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';s.style.fontSize=(10+Math.random()*14)+'px';fx.appendChild(s)}}
